<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Version Manager - JSONBin</title>
<style>
  body {
    font-family: Tahoma, sans-serif;
    background: #0d0d1a;
    color: #fff;
    padding: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .box {
    background: #1c1c30;
    padding: 40px;
    border-radius: 15px;
    width: 500px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    border: 1px solid #30304a;
  }
  h1 {
    color: #ff2d6f;
    text-align: center;
    margin-bottom: 30px;
  }
  label {
    display: block;
    margin-bottom: 8px;
    color: #00ff9d;
    font-weight: bold;
    font-size: 14px;
  }
  input {
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border: 2px solid #30304a;
    border-radius: 8px;
    background: #0d0d1a;
    color: #fff;
    font-size: 14px;
    box-sizing: border-box;
    font-family: monospace;
    direction: ltr;
  }
  input:focus {
    outline: none;
    border-color: #ff2d6f;
  }
  button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #ff2d6f, #d91d56);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.3s;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255,45,111,0.4);
  }
  button:disabled {
    background: #444;
    cursor: not-allowed;
    transform: none;
  }
  .msg {
    text-align: center;
    margin-top: 20px;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
  }
  .msg.success {
    background: #0a3d2a;
    color: #00ff9d;
    border: 1px solid #00ff9d;
    display: block;
  }
  .msg.error {
    background: #3d0a1a;
    color: #ff2d6f;
    border: 1px solid #ff2d6f;
    display: block;
  }
  .info {
    background: #0d0d1a;
    padding: 15px;
    border-radius: 8px;
    font-size: 12px;
    color: #7a7a98;
    margin-bottom: 20px;
    line-height: 1.8;
    border-right: 3px solid #00e5ff;
  }
  .current {
    text-align: center;
    margin-bottom: 20px;
    padding: 10px;
    background: #0d0d1a;
    border-radius: 8px;
    font-size: 14px;
    color: #00e5ff;
    font-family: monospace;
  }
</style>
</head>
<body>

<div class="box">
  <h1>⚙️ Version Manager</h1>

  <div class="info">
    این ابزار نسخه‌ی جدید رو توی JSONBin ذخیره می‌کنه.<br>
    بعد از ذخیره، هر برنامه‌ای که نسخه‌اش قدیمی باشه، <b>باز نمی‌شه</b>.
  </div>

  <div class="current" id="currentVersion">
    📌 نسخه فعلی سرور: <span id="currentVerText">در حال لود...</span>
  </div>

  <label>🔖 نسخه جدید (مثلاً: 1.0.1)</label>
  <input type="text" id="newVersion" placeholder="1.0.1">

  <button onclick="updateVersion()" id="updateBtn">💾 ذخیره نسخه جدید</button>

  <div class="msg" id="msg"></div>
</div>

<script>
  // ⚠️ اینا رو عوض کن
  const JSONBIN_BIN_ID = '6ab9d6e8ac6210605afc8ddd';
  const JSONBIN_ACCESS_KEY = '$2a$10$txJZZqUIjGHmVQg.Kn6rseZSS8a/hfJBZ6vQHdVqvnM3qxjLJWckm';

  async function loadCurrentVersion() {
    try {
      const res = await fetch(
        `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`,
        { headers: { 'X-Access-Key': JSONBIN_ACCESS_KEY } }
      );

      const data = await res.json();
      const version = data.record.latest_version || 'نامشخص';
      document.getElementById('currentVerText').textContent = version;
    } catch (e) {
      document.getElementById('currentVerText').textContent = 'خطا';
    }
  }

  async function updateVersion() {
    const newVersion = document.getElementById('newVersion').value.trim();
    const btn = document.getElementById('updateBtn');
    const msg = document.getElementById('msg');

    if (!newVersion) {
      msg.className = 'msg error';
      msg.textContent = '❌ نسخه رو وارد کن!';
      return;
    }

    btn.disabled = true;
    btn.textContent = '⏳ در حال ذخیره...';

    try {
      // ۱. دیتای فعلی رو بگیر
      const getRes = await fetch(
        `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`,
        { headers: { 'X-Access-Key': JSONBIN_ACCESS_KEY } }
      );

      const getData = await getRes.json();
      const record = getData.record;

      // ۲. نسخه رو آپدیت کن
      record.latest_version = newVersion;

      // ۳. ذخیره کن
      const putRes = await fetch(
        `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`,
        {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Access-Key': JSONBIN_ACCESS_KEY
          },
          body: JSON.stringify(record)
        }
      );

      if (putRes.ok) {
        msg.className = 'msg success';
        msg.textContent = '✅ نسخه با موفقیت ذخیره شد: ' + newVersion;
        document.getElementById('currentVerText').textContent = newVersion;
        document.getElementById('newVersion').value = '';
      } else {
        msg.className = 'msg error';
        msg.textContent = '❌ خطا در ذخیره!';
      }
    } catch (e) {
      msg.className = 'msg error';
      msg.textContent = '❌ خطا: ' + e.message;
    }

    btn.disabled = false;
    btn.textContent = '💾 ذخیره نسخه جدید';
  }

  loadCurrentVersion();
</script>

</body>
</html>
